name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # pnpm 11 needs Node >= 22.13, so install with Node 22 and then switch
      # to the matrix version to lint, build and test.
      - name: Setup Node.js for install
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Lint
        run: node_modules/.bin/eslint .

      - name: Build
        run: node_modules/.bin/tsc

      - name: Test
        run: node_modules/.bin/vitest run

      - name: Smoke test the built CLI
        run: node dist/bin/prelude.js diff --check
